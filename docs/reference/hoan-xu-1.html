<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoàn Xu – bản dựng thử</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--paper:#FFFFFF;--soft:#F1F5F2;--ink:#101513;--mute:#5E6A63;--line:#E1E7E3;
  --jade:#1DC467;--jade-ink:#04240F;--jade-deep:#0A8443;--jade-soft:#E3F8EB;
  --xu:#FFC531;--xu-ink:#3D2C00;--xu-soft:#FFF4D1;
  --red:#C9343A;--red-soft:#FCE9E9;--side-ad:#0E2A1B;--side-ad-line:#0E2A1B;--tp:#171B19;--tp-w:#C8D2CC;--tp-h:#39413D;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--paper:#0C0C0C;--soft:#181818;--ink:#F2F4F3;--mute:#9BA39E;--line:#242424;
    --jade:#3DDC84;--jade-ink:#04240F;--jade-deep:#5BE39A;--jade-soft:#0F2A1B;
    --xu:#FFC531;--xu-ink:#3D2C00;--xu-soft:#2E2608;
    --red:#FF8085;--red-soft:#2E1416;--side-ad:#050505;--side-ad-line:#242424;--tp:#2A302D;--tp-w:#F1F4F2;--tp-h:#4B5550;
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--paper:#0C0C0C;--soft:#181818;--ink:#F2F4F3;--mute:#9BA39E;--line:#242424;
    --jade:#3DDC84;--jade-ink:#04240F;--jade-deep:#5BE39A;--jade-soft:#0F2A1B;
    --xu:#FFC531;--xu-ink:#3D2C00;--xu-soft:#2E2608;
    --red:#FF8085;--red-soft:#2E1416;--side-ad:#050505;--side-ad-line:#242424;--tp:#2A302D;--tp-w:#F1F4F2;--tp-h:#4B5550;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1{font-size:28px;line-height:1.2;font-weight:800;letter-spacing:-.02em}
h2{font-size:18px;line-height:1.3;font-weight:700}
h3{font-size:15px;font-weight:600}
a{color:var(--jade-deep)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--xu);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.small{font-size:13px}

/* khung */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;align-self:start;height:100vh;padding:20px 12px;border-right:1px solid var(--line);background:var(--paper);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand-mark{width:34px;height:34px;border-radius:9px;background:#1DC467;display:grid;place-items:center;overflow:hidden;flex:none}
.brand-mark .tapir{--tp:#171B19;--tp-w:#FFFFFF;--tp-h:#39413D}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;border-radius:9px;background:none;text-align:left;cursor:pointer;color:var(--mute);font-weight:500}
.nav button:hover{background:var(--soft);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--jade-soft);color:var(--jade-deep);font-weight:600}
.nav .sep{margin:12px 10px 4px;font-size:12px;color:var(--mute)}
.badge{margin-left:auto;min-width:20px;padding:0 6px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;line-height:20px;text-align:center;font-weight:700}
.ico{width:19px;height:19px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{padding:28px clamp(16px,4vw,44px) 80px;max-width:980px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head p{color:var(--mute);max-width:60ch;margin-top:6px}
.demo-flag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;background:var(--xu-soft);color:var(--ink);font-size:12px;font-weight:600}

/* khối */
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.card{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stat{padding:14px 16px}
.stat b{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.grow{flex:1;min-width:0}
.clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.wait{background:var(--xu-soft);color:var(--ink)}
.pill.ok{background:var(--jade-soft);color:var(--jade-deep)}
.pill.no{background:var(--red-soft);color:var(--red)}
.pill.off{background:var(--soft);color:var(--mute)}
.logo{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none;font-weight:800;font-size:13px;color:#fff}
.logo.shopee{background:#EE4D2D}.logo.lazada{background:#3B1FA3}.logo.tiktok{background:#111}.logo.tiki{background:#1A94FF}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--jade-soft);color:var(--jade-deep);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}

/* nút & ô nhập */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;border:1px solid transparent;background:var(--jade);color:var(--jade-ink);font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.xu{background:var(--xu);color:var(--xu-ink)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:600}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);min-width:0}
.inp::placeholder{color:var(--mute)}
textarea.inp{resize:vertical;min-height:74px}
.err{color:var(--red);font-size:13px;font-weight:500}
.note{padding:12px 14px;border-radius:10px;background:var(--xu-soft);font-size:14px}
.note.warn{background:var(--red-soft)}

/* tấm vé đổi link: điểm nhấn duy nhất */
.ticket{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 210px;background:var(--paper);border:1px solid var(--line);border-radius:16px}
.ticket-main{padding:20px}
.ticket-stub{position:relative;padding:20px;border-left:2px dashed var(--line);background:var(--jade);color:var(--jade-ink);border-radius:0 15px 15px 0;display:flex;flex-direction:column;justify-content:center}
.ticket-stub::before,.ticket-stub::after{content:"";position:absolute;left:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket-stub::before{top:-11px}.ticket-stub::after{bottom:-11px}
.ticket-stub b{font-size:40px;line-height:1;font-weight:800;letter-spacing:-.03em}
.ticket-stub span{font-size:13px;opacity:.9;margin-top:8px}
.ticket-stub .upto{display:block;margin:0 0 4px;font-weight:600;opacity:1;white-space:nowrap}
.paste{display:flex;gap:8px;margin-top:12px}
.out{margin-top:14px;padding:14px;border-radius:12px;background:var(--jade-soft)}
.out code{display:block;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all;margin:6px 0 12px;color:var(--ink)}
.chans{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.chan{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer;text-align:left}
.chan[aria-pressed="true"]{border-color:var(--jade);box-shadow:0 0 0 2px var(--jade-soft)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:10px}
.steps li{counter-increment:s;display:flex;gap:12px}
.steps li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--jade-soft);color:var(--jade-deep);display:grid;place-items:center;font-size:12px;font-weight:700}

/* điểm danh */
.streak{display:flex;align-items:center;gap:22px}
.streak.risk{border-color:var(--red)}
.flame{display:block;flex:none;transform-origin:50% 100%}
.streak .flame.lit{animation:flick 1.8s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(-1.5deg)}50%{transform:scale(1.03,1.07) rotate(1.5deg)}}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:12px;color:var(--mute)}
.wd i{display:grid;place-items:center;width:40px;height:40px;margin:0 auto 5px;border-radius:50%;background:var(--soft);font-style:normal;font-weight:600}
.wd.done i{background:var(--xu-soft)}
.wd.today i{outline:2px dashed var(--jade);outline-offset:2px;color:var(--ink)}
.wd b{color:var(--ink)}
.miles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mile{display:grid;justify-items:center;gap:2px;padding:12px 6px;border:1px solid var(--line);border-radius:12px;text-align:center}
.mile.got{background:var(--xu-soft);border-color:var(--xu)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{padding:10px 4px;border-radius:10px;border:1px solid var(--line);text-align:center;font-size:12px;color:var(--mute)}
.day b{display:block;font-size:15px;color:var(--ink)}
.day.done{background:var(--xu);border-color:var(--xu);color:var(--xu-ink)}
.day.done b{color:var(--xu-ink)}
.bar{height:8px;border-radius:8px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade);border-radius:8px}
.tabs{display:inline-flex;padding:3px;border-radius:11px;background:var(--soft);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--mute)}
.tabs button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(14,42,27,.12)}
.tapir{display:block;flex:none}
.empty .tapir{margin:0 auto 10px}
.brand-mark svg{display:block}
.empty{text-align:center;padding:34px 16px;color:var(--mute)}
.empty h3{color:var(--ink);margin-bottom:4px}
.empty .btn{margin-top:14px}
details{border-top:1px solid var(--line);padding:13px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600}
details p{margin-top:8px;color:var(--mute);max-width:70ch}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex:none}
.scroll-x{overflow-x:auto}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
.toast.on{opacity:1}

/* thanh chuyển giao diện + quản trị */
.modebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px clamp(14px,3vw,24px);background:var(--paper);border-bottom:1px solid var(--line);font-size:13px}
.role{white-space:nowrap;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.16);margin-left:auto}
.role:empty{display:none}
body[data-mode="ad"] .side{background:var(--side-ad);border-right-color:var(--side-ad-line)}
body[data-mode="ad"] .brand{color:#fff}
body[data-mode="ad"] .side .nav button{color:#B5CBBD}
body[data-mode="ad"] .side .nav button:hover{background:rgba(255,255,255,.08);color:#fff}
body[data-mode="ad"] .side .nav button[aria-current="page"]{background:#1DC467;color:#04240F}
body[data-mode="ad"] main{max-width:1260px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--mute);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl td.act{white-space:nowrap;text-align:right}
.tbl td.act .btn{margin-left:4px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

/* thanh dưới (điện thoại) */
.tabbar{display:none}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet-in{width:100%;background:var(--paper);border-radius:18px 18px 0 0;padding:14px 12px calc(14px + env(safe-area-inset-bottom,0px))}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding:18px 14px 110px}
  h1{font-size:23px}
  .grid2,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid3{grid-template-columns:minmax(0,1fr)}
  .grid2.one{grid-template-columns:minmax(0,1fr)}
  .chans{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ticket{grid-template-columns:minmax(0,1fr)}
  .ticket-stub{border-left:0;border-top:2px dashed var(--line);border-radius:0 0 15px 15px;flex-direction:row;align-items:center;gap:14px;justify-content:flex-start}
  .ticket-stub::before{top:-11px;left:-11px}.ticket-stub::after{top:-11px;bottom:auto;left:auto;right:-11px}
  .ticket-stub b{font-size:30px}.ticket-stub span{margin:0}
  .paste{flex-direction:column}
  .streak{flex-direction:column;text-align:center}
  .streak .row{justify-content:center}
  .wd i{width:34px;height:34px}
  .miles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tabbar{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--paper);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
  .tabbar button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:5px 0;font-size:11px;color:var(--mute);cursor:pointer;font-weight:500}
  .tabbar button[aria-current="page"]{color:var(--jade-deep);font-weight:700}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="shell">

</div>

  var D={

function detect(url){
  var h;try{h=new URL(url).hostname.replace(/^www\./,"")}catch(e){return null}
  for(var k in CH){if(CH[k].hosts.some(function(x){return h===x||h.endsWith("."+x)}))return k}
  return null;
}
function readyNames(){return Object.keys(CH).filter(chanReady).map(function(k){return CH[k].name}).join(", ")}
function chanReady(k){var c=S.cfg.channels[k];return !!(c&&c.tpl&&(c.tpl.indexOf("{aff_id}")<0||c.affId))}
function buildLink(raw){
  var url=raw.trim();
  if(!url)return{err:"Dán link sản phẩm vào ô trước khi lấy link."};
  if(!/^https?:\/\//i.test(url))url="https://"+url;
  var ch=detect(url);
  if(!ch)return{err:"Link này không thuộc sàn nào đang hỗ trợ. Kiểm tra lại link sản phẩm"+(readyNames()?" "+readyNames():"")+"."};
  if(!chanReady(ch))return{err:"Hiện chưa hỗ trợ hoàn tiền cho "+CH[ch].name+".",needCfg:true};
  var c=S.cfg.channels[ch];
  var sub=String(S.cfg.userCode).replace(/[^A-Za-z0-9]/g,"");
  var out=c.tpl.replace(/\{url\}/g,encodeURIComponent(url)).replace(/\{aff_id\}/g,encodeURIComponent(c.affId)).replace(/\{sub_id\}/g,sub);
  return{ch:ch,src:url,out:out};
}

function cashback(o){return o.value*o.rate*S.cfg.share/100}

function mine(){return S.orders.filter(function(o){return o.u===ME()})}
function userName(c){var u=S.users.filter(function(x){return x.code===c})[0];return u?u.name:c}
function total(a,f){return a.reduce(function(t,x){return t+f(x)},0)}
function sums(u){
  u=u||ME();var w=0,ok=0,nOk=0;
  S.orders.forEach(function(o){if(o.u!==u)return;if(o.status==="wait")w+=cashback(o);if(o.status==="ok"){ok+=cashback(o);nOk++}});
  var conv=u===ME()?total(S.xuLog.filter(function(x){return x.vnd}),function(x){return x.vnd}):0;
  var mw=S.withdraws.filter(function(x){return x.u===u});
  var paid=total(mw.filter(function(x){return x.status==="paid"}),function(x){return x.amount});
  var hold=total(mw.filter(function(x){return x.status==="wait"}),function(x){return x.amount});
  return{wait:w,ok:ok,nOk:nOk,paid:paid,hold:hold,avail:ok+conv-paid-hold};
}

  '<div class="grid3"><div class="card stat"><span class="small mute">Người dùng</span><b class="num">'+S.users.length+'</b></div><div class="card stat"><span class="small mute">Link đã tạo</span><b class="num">'+S.links.length+'</b></div><div class="card stat"><span class="small mute">Đã chuyển khoản cho người dùng</span><b class="num">'+vnd(total(S.withdraws.filter(function(w){return w.status==="paid"}),function(w){return w.amount}))+'</b></div></div></div>';
};
V.a_orders=function(){
  var lab={wait:"Chờ đối soát",ok:"Đã duyệt",no:"Đã hủy",all:"Tất cả"},c={wait:0,ok:0,no:0,all:S.orders.length};S.orders.forEach(function(o){c[o.status]++});
  var list=S.orders.filter(function(o){return ui.atab==="all"||o.status===ui.atab});
  return head("Đối soát đơn hàng","Duyệt đơn khi sàn xác nhận hoa hồng, hủy đơn khi sàn từ chối. Tiền chỉ vào ví người dùng sau khi duyệt.",sampleFlag())+
  '<div class="stack"><div class="tabs">'+["wait","ok","no","all"].map(function(k){return '<button data-atab="'+k+'" aria-pressed="'+(ui.atab===k)+'">'+lab[k]+' <span class="num">('+c[k]+')</span></button>'}).join("")+'</div>'+
  '<div class="card">'+tbl(["Ngày","Người dùng","Kênh","Sản phẩm",">Giá trị đơn",">Hoa hồng sàn",">Hoàn cho khách","Trạng thái",""],list.map(function(o){
    return '<tr><td class="num">'+fmtDate(o.at)+'</td><td>'+who(o.u)+'</td><td>'+CH[o.ch].name+'</td><td>'+esc(o.name)+'</td><td class="r num">'+vnd(o.value)+'</td><td class="r num">'+vnd(comm(o))+'<div class="small mute">'+(Math.round(o.rate*1000)/10)+'%</div></td><td class="r num">'+vnd(cashback(o))+'</td><td>'+statusPill(o.status)+'</td><td class="act">'+(o.status==="wait"?'<button class="btn sm" data-act="o_ok" data-id="'+o.id+'">Duyệt</button><button class="btn sm ghost" data-act="o_no" data-id="'+o.id+'">Hủy</button>':'')+'</td></tr>'}),"Không có đơn nào ở mục này.")+'</div>'+
  '<form class="card stack" data-form="addorder"><div><h2>Thêm đơn từ báo cáo của sàn</h2><p class="small mute">Ở bản chạy thật, đơn được kéo tự động từ báo cáo chuyển đổi và khớp với người dùng theo sub_id. Ở đây nhập tay để thử luồng.</p></div><div class="grid2"><div class="field"><label for="ou">Người dùng (sub_id)</label><select class="inp" id="ou" name="u">'+S.users.map(function(u){return '<option value="'+esc(u.code)+'">'+esc(u.code)+', '+esc(u.name)+'</option>'}).join("")+'</select></div><div class="field"><label for="oc">Kênh</label><select class="inp" id="oc" name="ch">'+Object.keys(CH).map(function(k){return '<option value="'+k+'">'+CH[k].name+'</option>'}).join("")+'</select></div></div><div class="field"><label for="on">Tên sản phẩm</label><input class="inp" id="on" name="name" required maxlength="80"></div><div class="grid2"><div class="field"><label for="ov">Giá trị đơn (đ)</label><input class="inp num" id="ov" name="value" type="number" min="1000" step="1000" required></div><div class="field"><label for="or">Tỷ lệ hoa hồng sàn trả (%)</label><input class="inp num" id="or" name="rate" type="number" min="0.1" max="50" step="0.1" required></div></div><div><button class="btn" type="submit">Thêm đơn</button></div></form></div>';
};
V.a_pay=function(){
  return head("Yêu cầu rút tiền","Chuyển khoản xong thì đánh dấu đã chuyển. Từ chối thì tiền quay lại số dư của người dùng.",sampleFlag())+
  '<div class="card">'+tbl(["Ngày","Người dùng","Ngân hàng","Số tài khoản",">Số tiền","Trạng thái",""],S.withdraws.map(function(w){
    return '<tr><td class="num">'+fmtDate(w.at)+'</td><td>'+who(w.u)+'</td><td>'+esc(w.bank)+'</td><td class="num">'+esc(w.acc)+'</td><td class="r num"><b>'+vnd(w.amount)+'</b></td><td>'+wPill(w.status)+'</td><td class="act">'+(isWait(w)?'<button class="btn sm" data-act="w_paid" data-id="'+w.id+'">Đã chuyển khoản</button><button class="btn sm ghost" data-act="w_no" data-id="'+w.id+'">Từ chối</button>':'')+'</td></tr>'}),"Chưa có yêu cầu rút tiền nào.")+'</div>';
};
V.a_users=function(){
  return head("Người dùng","Số dư tính từ đơn đã duyệt trừ tiền đã rút và đang chờ rút.",sampleFlag())+
  '<div class="card">'+tbl(["Người dùng","Tham gia",">Đơn đã duyệt",">Chờ duyệt (dự kiến)",">Đã hoàn",">Đã rút",">Đang chờ rút",">Số dư"],S.users.map(function(u){var x=sums(u.code);
    return '<tr><td>'+who(u.code)+'</td><td class="num">'+fmtDate(u.at)+'</td><td class="r num">'+x.nOk+'</td><td class="r num">'+vnd(x.wait)+'</td><td class="r num">'+vnd(x.ok)+'</td><td class="r num">'+vnd(x.paid)+'</td><td class="r num">'+vnd(x.hold)+'</td><td class="r num"><b>'+vnd(x.avail)+'</b></td></tr>'}),"Chưa có người dùng.")+'</div>';
};
V.a_gift=function(){
  var gp={wait:'<span class="pill wait">Chờ gửi mã</span>',done:'<span class="pill ok">Đã gửi mã</span>',no:'<span class="pill no">Từ chối</span>'};
  return head("Yêu cầu đổi quà","Gửi mã voucher cho người dùng rồi đánh dấu đã gửi. Từ chối thì xu được trả lại.")+
  '<div class="card">'+tbl(["Ngày","Người dùng","Quà",">Xu","Trạng thái",""],S.gifts.map(function(r){var g=GIFTS.filter(function(x){return x[0]===r.gift})[0]||["","Quà đã gỡ","",0];
    return '<tr><td class="num">'+fmtDate(r.at)+'</td><td>'+who(r.u)+'</td><td>'+g[1]+'</td><td class="r num">'+g[3]+'</td><td>'+gp[r.status]+'</td><td class="act">'+(r.status==="wait"?'<button class="btn sm" data-act="g_done" data-id="'+r.id+'">Đã gửi mã</button><button class="btn sm ghost" data-act="g_no" data-id="'+r.id+'">Từ chối</button>':'')+'</td></tr>'}),"Chưa có yêu cầu đổi quà. Yêu cầu xuất hiện khi khách đổi voucher ở giao diện khách.")+'</div>';
};
V.a_deal=function(){
  return head("Deal cộng đồng","Ẩn bài sai, hết hạn hoặc chèn link affiliate của người khác.",sampleFlag())+
  '<div class="card">'+tbl(["Ngày","Người đăng","Kênh","Nội dung",">Hữu ích","Trạng thái",""],S.deals.map(function(d){
    return '<tr><td class="num">'+fmtDate(d.at)+'</td><td><b>'+esc(d.by)+'</b></td><td>'+CH[d.ch].name+'</td><td style="min-width:240px">'+esc(d.text)+'</td><td class="r num">'+d.likes+'</td><td>'+(d.hidden?'<span class="pill off">Đang ẩn</span>':'<span class="pill ok">Đang hiện</span>')+'</td><td class="act"><button class="btn sm ghost" data-act="d_tog" data-id="'+d.id+'">'+(d.hidden?"Hiện bài":"Ẩn bài")+'</button><button class="btn sm ghost" data-act="d_del" data-id="'+d.id+'">Xóa bài</button></td></tr>'}),"Chưa có bài đăng nào.")+'</div>';
};
V.a_notif=function(){
  return head("Gửi thông báo","Thông báo gửi đi hiện ở mục Thông báo của mọi người dùng.")+
  '<div class="stack"><form class="card stack" data-form="notif"><div class="field"><label for="nt">Tiêu đề</label><input class="inp" id="nt" name="title" required maxlength="80"></div><div class="field"><label for="nb">Nội dung</label><textarea class="inp" id="nb" name="body" required maxlength="300"></textarea></div><div><button class="btn" type="submit">Gửi thông báo</button></div></form>'+
  '<div class="card"><h2 style="margin-bottom:8px">Đã gửi</h2>'+tbl(["Ngày","Tiêu đề","Nội dung",""],S.notifs.map(function(n){return '<tr><td class="num">'+fmtDate(n.at)+'</td><td><b>'+esc(n.title)+'</b></td><td>'+esc(n.body)+'</td><td class="act"><button class="btn sm ghost" data-act="n_del" data-id="'+n.id+'">Xóa thông báo</button></td></tr>'}),"Chưa gửi thông báo nào.")+'</div></div>';
};

function render(){if(!V[view])view=S.mode==="ad"?"a_home":"home";drawNav();document.getElementById("main").innerHTML=V[view]()}


/* ---------- sự kiện ---------- */
function copy(t){
  function done(){toast("Đã sao chép link")}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fb)}else fb();
  function fb(){var a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){toast("Không sao chép được, hãy chọn và sao chép thủ công")}a.remove()}
}
document.addEventListener("click",function(e){
  var m=e.target.closest("button[data-mode],a[data-mode]");if(m){e.preventDefault();setMode(m.getAttribute("data-mode"),m.getAttribute("data-view"));return}
  var at=e.target.closest("[data-atab]");if(at){ui.atab=at.getAttribute("data-atab");render();return}
  var g=e.target.closest("[data-go]");if(g){e.preventDefault();go(g.getAttribute("data-go"));return}
  var t=e.target.closest("[data-tab]");if(t){ui.tab=t.getAttribute("data-tab");render();return}
  if(e.target.id==="sheet"){e.target.classList.remove("on");return}
  var a=e.target.closest("[data-act]");if(!a||a.disabled)return;
  var act=a.getAttribute("data-act"),id=a.getAttribute("data-id");
  if(act==="theme"){S.theme=isDark()?"light":"dark";applyTheme();save();drawNav();return}
  if(act==="more"){document.getElementById("sheet").classList.add("on");return}
  if(act==="copy"&&ui.result){copy(ui.result.out);return}
  if(act==="keep"&&ui.result){S.links.forEach(function(l){if(l.out===ui.result.out)l.saved=true});save();render();toast("Đã lưu link");return}
  if(act==="copyl"){var l=S.links.filter(function(x){return x.id===id})[0];if(l)copy(l.out);return}
  if(act==="tog"){S.links.forEach(function(x){if(x.id===id)x.saved=!x.saved});save();render();return}
  if(act==="like"){S.deals.forEach(function(d){if(d.id===id)d.likes++});save();render();return}
  if(act==="readall"){S.read=S.notifs.map(function(n){return n.id});save();render();return}
  if(act==="checkin"){var c=S.checkin,td=today();if(c.last===td)return;
    c.streak=(c.last&&dayDiff(c.last,td)===1)?c.streak+1:1;c.last=td;c.best=Math.max(c.best||0,c.streak);
    var got=1,ms=MILES.filter(function(m){return m[0]===c.streak})[0];
    S.xu+=1;S.xuLog.unshift({t:"Điểm danh ngày "+c.streak+" của chuỗi",d:1,at:td});
    if(ms){S.xu+=ms[1];got+=ms[1];S.xuLog.unshift({t:"Thưởng mốc chuỗi "+ms[0]+" ngày",d:ms[1],at:td})}
    save();render();toast(ms?"Đạt mốc "+ms[0]+" ngày, +"+got+" xu":"Đã điểm danh, +1 xu");return}
  if(act==="redeem"){var gft=GIFTS.filter(function(x){return x[0]===id})[0];if(!gft||S.xu<gft[3])return;
    S.xu-=gft[3];S.gifts.unshift({id:uid(),gift:id,u:ME(),at:today(),status:"wait"});S.xuLog.unshift({t:"Đổi "+gft[1],d:-gft[3],at:today()});save();render();toast("Đã gửi yêu cầu đổi voucher");return}
  function pick(arr){return arr.filter(function(x){return x.id===id})[0]}
  if(act==="o_ok"||act==="o_no"){var o=pick(S.orders);if(o){o.status=act==="o_ok"?"ok":"no";save();render();toast(act==="o_ok"?"Đã duyệt đơn":"Đã hủy đơn")}return}
  if(act==="w_paid"||act==="w_no"){var w=pick(S.withdraws);if(w){w.status=act==="w_paid"?"paid":"no";save();render();toast(act==="w_paid"?"Đã đánh dấu đã chuyển":"Đã từ chối yêu cầu")}return}
  if(act==="g_done"||act==="g_no"){var q=pick(S.gifts);if(!q)return;var gg=GIFTS.filter(function(x){return x[0]===q.gift})[0];
    if(act==="g_done"){q.status="done";S.notifs.unshift({id:uid(),title:"Mã "+(gg?gg[1]:"voucher")+" đã được gửi",body:"Kiểm tra email đăng ký để nhận mã voucher.",at:today()});toast("Đã đánh dấu đã gửi mã")}
    else{q.status="no";if(gg&&q.u===ME()){S.xu+=gg[3];S.xuLog.unshift({t:"Hoàn xu do từ chối đổi "+gg[1],d:gg[3],at:today()})}toast("Đã từ chối yêu cầu")}
    save();render();return}
  if(act==="d_tog"){var dl=pick(S.deals);if(dl){dl.hidden=!dl.hidden;save();render()}return}
  if(act==="d_del"){S.deals=S.deals.filter(function(x){return x.id!==id});save();render();toast("Đã xóa bài");return}
  if(act==="n_del"){S.notifs=S.notifs.filter(function(x){return x.id!==id});save();render();toast("Đã xóa thông báo");return}
  if(act==="clear"){S.orders=[];S.deals=[];S.board=[];S.notifs=[];S.users=S.users.filter(function(u){return u.code===ME()});S.withdraws=S.withdraws.filter(function(w){return w.u===ME()});S.sample=false;save();render();toast("Đã xóa dữ liệu mẫu");return}
  if(act==="restore"){var d=sampleData(ME());S.orders=d.orders;S.deals=d.deals;S.board=d.board;S.notifs=d.notifs;S.users=d.users;S.withdraws=S.withdraws.filter(function(w){return w.u===ME()}).concat(d.withdraws);S.sample=true;save();render();toast("Đã nạp lại dữ liệu mẫu");return}
});
document.addEventListener("submit",function(e){
  var f=e.target,kind=f.getAttribute("data-form");if(!kind)return;e.preventDefault();
  var d=new FormData(f);
  if(kind==="convert"){var r=buildLink(String(d.get("url")||""));
    if(r.err){ui.err=r;ui.result=null}else{ui.err=null;ui.result=r;
      if(!S.links.some(function(l){return l.out===r.out}))S.links.unshift({id:uid(),ch:r.ch,src:r.src,out:r.out,at:today(),saved:false});save()}
    render();return}
  if(kind==="deal"){S.deals.unshift({id:uid(),by:"Bạn",text:String(d.get("text")).trim(),ch:String(d.get("ch")),at:today(),likes:0});save();render();toast("Đã đăng deal");return}
  if(kind==="xu"){var n=parseInt(d.get("n"),10);
    if(!n||n%10!==0){toast("Nhập bội số của 10");return}
    if(n>S.xu){toast("Bạn chỉ có "+S.xu+" xu");return}
    S.xu-=n;S.xuLog.unshift({t:"Đổi xu thành tiền trong ví",d:-n,vnd:n*300,at:today()});save();render();toast("Đã đổi "+n+" xu thành "+vnd(n*300));return}
  if(kind==="withdraw"){var amt=parseInt(d.get("amount"),10),av=sums().avail;
    if(amt>av){ui.werr="Số dư có thể rút là "+vnd(av)+". Nhập số tiền nhỏ hơn hoặc bằng số này.";render();return}
    ui.werr=null;S.withdraws.unshift({id:uid(),u:ME(),status:"wait",bank:String(d.get("bank")).trim(),acc:String(d.get("acc")).trim(),amount:amt,at:today()});save();render();toast("Đã gửi yêu cầu rút tiền");return}
  if(kind==="addorder"){S.orders.unshift({id:uid(),u:String(d.get("u")),ch:String(d.get("ch")),name:String(d.get("name")).trim(),value:parseInt(d.get("value"),10),rate:parseFloat(d.get("rate"))/100,status:"wait",at:today()});ui.atab="wait";save();render();toast("Đã thêm đơn");return}
  if(kind==="notif"){S.notifs.unshift({id:uid(),title:String(d.get("title")).trim(),body:String(d.get("body")).trim(),at:today()});save();render();toast("Đã gửi thông báo");return}
  if(kind==="cfg"){S.cfg.brand=String(d.get("brand")).trim()||"Hoàn Xu";S.cfg.share=Math.min(100,Math.max(1,parseInt(d.get("share"),10)||50));S.cfg.maxPct=Math.min(100,Math.max(0.1,parseFloat(d.get("maxPct"))||40));var oc=S.cfg.userCode,nc=String(d.get("userCode")).trim();S.cfg.userCode=nc;if(oc!==nc){[S.orders,S.withdraws,S.gifts].forEach(function(a){a.forEach(function(x){if(x.u===oc)x.u=nc})});S.users.forEach(function(x){if(x.code===oc)x.code=nc})}
    Object.keys(CH).forEach(function(k){S.cfg.channels[k]={affId:String(d.get("aff_"+k)||"").trim(),tpl:String(d.get("tpl_"+k)||"").trim()}});
    ui.err=null;save();render();toast("Đã lưu cài đặt");return}
});

load();if(!S.mp40){S.cfg.maxPct=40;S.mp40=true;save()}applyTheme();view=S.mode==="ad"?"a_home":"home";render();
})();
</script>
